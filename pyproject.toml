[project]
name = "multimodal-rag"
version = "2.0.0"
description = "Multimodal RAG with Google Gemini Multimodal Embeddings, ChromaDB, and Vision"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "google-generativeai>=0.8.0",
    "langchain-google-genai>=2.0.0",
    "PyMuPDF>=1.24.0",
    "Pillow>=10.0.0",
    "chromadb>=0.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "numpy>=1.26.0",
    "groq>=0.9.0",
    "boto3>=1.34.0",
    "langchain-aws>=0.1.0",
]